name: padcare
description: "PadCare - Dignified Menstrual Hygiene Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.3
  google_maps_flutter: ^2.19.0
  google_maps_flutter_web: ^0.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/docs/
