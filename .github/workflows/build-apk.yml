name: Build Android APK

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PadCare APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Test Suite
        run: flutter test

      - name: Build Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TRANSLATION_API_URL: ${{ vars.TRANSLATION_API_URL }}
        run: |
          args=()
          if [ -n "$SUPABASE_URL" ]; then args+=(--dart-define="SUPABASE_URL=$SUPABASE_URL"); fi
          if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then args+=(--dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"); elif [ -n "$SUPABASE_ANON_KEY" ]; then args+=(--dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"); fi
          if [ -n "$TRANSLATION_API_URL" ]; then args+=(--dart-define="TRANSLATION_API_URL=$TRANSLATION_API_URL"); fi
          flutter build apk --release "${args[@]}"

      - name: Upload PadCare Release APK
        uses: actions/upload-artifact@v4
        with:
          name: padcare-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
